# Internal-only load balancer in front of the two backend replicas (see docker-compose.yml's
# backend-lb service). The frontend's server-side calls (BACKEND_URL=http://backend-lb:8080) go
# through here rather than a single replica directly, so a request never fails just because the
# specific replica it would have hit happens to be mid-restart during a rolling deploy — nginx
# silently retries it against the other one instead.
#
# D-11-incident note: a plain `upstream { server host:port; }` block resolves each hostname to an
# IP exactly ONCE — either at nginx startup or at the next `-s reload` — and there is no OSS-nginx
# way to make a classic upstream block re-resolve periodically. In practice this made the whole LB
# fail (both replicas at once) whenever a backend container was recreated (a fresh IP) without a
# matching, perfectly-timed reload here. The fix below uses a `resolver` directive + a variable in
# `proxy_pass` instead of a static `upstream` block — nginx then re-resolves the hostname on every
# new upstream connection (bounded by `valid=`), so a stale answer only survives a few seconds
# instead of until the next manual reload/recreate.
#
# 2026-08-10 incident note: the hostnames below are the container names (`salonreview-backend-*`),
# NOT the bare Compose service names (`backend-green`/`backend-blue`) — this was the actual root
# cause of a ~2-day intermittent-failure incident (Messages, Salary Report, and the AI SMS draft
# button all randomly failing). salonLandings (the "mani" app) is intentionally attached to this
# same Docker network for its own internal API calls into this backend, and its docker-compose.yml
# happens to name ITS OWN backend services `backend-green`/`backend-blue` too. Docker registers
# every service's bare name as a DNS alias on every network it's attached to, so on this shared
# network the bare name `backend-green` resolved to TWO different containers (this app's and
# mani's) and nginx picked essentially at random. Container names are enforced globally unique by
# the Docker daemon, so resolving by container name instead eliminates the collision entirely — no
# change needed on salonLandings' side. See docker-compose.yml's container_name: for each service.
#
# Trade-off: this loses the old round-robin split-across-both-replicas behavior in favor of a
# primary + automatic-fallback shape (green primary, blue fallback) — acceptable, since
# ShedLock (SchedulerLockConfig, V64) already makes it safe for either replica to be live
# regardless of which one is actually serving web traffic at a given moment.
resolver 127.0.0.11 valid=5s;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # The SEO AI Advisor's "Analyze" button (SeoAiAdvisorController#analyze) calls Claude
    # synchronously with up to 4096 output tokens on a fairly involved consultant-style prompt —
    # comfortably capable of running past the 60s default proxy_read_timeout below, which surfaced
    # live as a 504 on this route specifically (2026-09-08). `location =` exact-match takes
    # precedence over the generic `/` prefix location regardless of file order, so this alone is
    # enough to give just this one route more room; every other route keeps the tighter default.
    # Kept the same primary+fallback shape as `/` below (rather than dropping it) so a genuinely
    # dead green still fails over to blue — only the timeout that triggers that fallback changed.
    location = /api/owner/marketing/seo/advisor/analyze {
        set $backend_primary http://salonreview-backend-green:8080;
        proxy_pass $backend_primary;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @seo_advisor_fallback;
    }

    location @seo_advisor_fallback {
        set $backend_fallback http://salonreview-backend-blue:8080;
        proxy_pass $backend_fallback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        set $backend_primary http://salonreview-backend-green:8080;
        proxy_pass $backend_primary;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback;
    }

    location @fallback {
        set $backend_fallback http://salonreview-backend-blue:8080;
        proxy_pass $backend_fallback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
    }
}
