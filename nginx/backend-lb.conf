# Internal-only load balancer in front of the two backend replicas (see docker-compose.yml's
# backend-lb service). The frontend's server-side calls (BACKEND_URL=http://backend-lb:8080) go
# through here rather than a single replica directly, so a request never fails just because the
# specific replica it would have hit happens to be mid-restart during a rolling deploy — nginx
# silently retries it against the other one instead.
#
# Backend containers get a fresh IP every time they're recreated, but this nginx only resolves
# their hostnames once at its own startup. The rolling-deploy sequence (.github/workflows/
# deploy.yml) runs `nginx -s reload` here right after both backend replicas are confirmed healthy
# — a graceful reload re-resolves the upstream hostnames to their current IPs without dropping any
# in-flight connection, so it never needs a hard restart of its own.
#
# backend-green was briefly out of rotation: running two permanently-live backend instances
# raced several @Scheduled jobs (SmsReplyFlowScheduler, LeadFollowUpScheduler,
# SameDayRebookingScheduler/GroupExpiryScheduler) that had no distributed lock, risking duplicate
# SMS sends to real customers. Fixed via ShedLock (see SchedulerLockConfig, V64 migration, and the
# @SchedulerLock annotations on those methods) — each now only actually runs on whichever replica
# wins the lock, so both replicas being live again is safe.
upstream backend_api {
    server backend-blue:8080 max_fails=1 fail_timeout=3s;
    server backend-green:8080 max_fails=1 fail_timeout=3s;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
