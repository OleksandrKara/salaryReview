name: CI / Deploy

# Run tests on every push and PR; deploy to the VPS only when master passes.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image (official postgres:16 + the vector extension) so Flyway V22 can
        # CREATE EXTENSION vector during the migration run. Matches docker-compose.yml.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: salonreview
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: salon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salon -d salonreview"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend tests (incl. Flyway migrations against Postgres)
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/salonreview
          SPRING_DATASOURCE_USERNAME: salon
          SPRING_DATASOURCE_PASSWORD: salon
        run: ./mvnw -B -ntp test

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck + production build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}        # optional, defaults to 22
          APP_DIR: ${{ secrets.VPS_APP_DIR }}  # optional, defaults to ~/salaryReview
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" "$USER@$HOST" bash -se <<EOF
            set -euo pipefail
            cd "${APP_DIR:-\$HOME/salaryReview}"
            git fetch origin master
            # Match master exactly; the gitignored .env (secrets) and the postgres volume are untouched.
            git reset --hard origin/master
            # 'ubuntu' needs sudo for docker on this host (passwordless sudo is enabled).
            sudo docker compose up -d --build
            sudo docker image prune -f
            # Wait for the backend health check to report healthy (up to ~90s).
            for i in \$(seq 1 30); do
              if [ "\$(sudo docker inspect -f '{{.State.Health.Status}}' salonreview-backend 2>/dev/null)" = "healthy" ]; then
                echo "backend healthy"; break
              fi
              sleep 3
            done
            sudo docker compose ps
          EOF
