name: CI / Deploy

# Run tests on every push and PR; deploy to the VPS only when master passes.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image (official postgres:16 + the vector extension) so Flyway V22 can
        # CREATE EXTENSION vector during the migration run. Matches docker-compose.yml.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: salonreview
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: salon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salon -d salonreview"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend tests + coverage gate (incl. Flyway migrations against Postgres)
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/salonreview
          SPRING_DATASOURCE_USERNAME: salon
          SPRING_DATASOURCE_PASSWORD: salon
        # verify (not test) so jacoco:check runs — see docs/COVERAGE.md.
        run: ./mvnw -B -ntp verify

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck + production build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}        # optional, defaults to 22
          APP_DIR: ${{ secrets.VPS_APP_DIR }}  # optional, defaults to ~/salaryReview
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" "$USER@$HOST" bash -se <<EOF
            set -euo pipefail
            cd "${APP_DIR:-\$HOME/salaryReview}"
            git fetch origin master
            # Match master exactly; the gitignored .env (secrets) and the postgres volume are untouched.
            git reset --hard origin/master
            # 'ubuntu' needs sudo for docker on this host (passwordless sudo is enabled).

            # Rolling deploy: build the shared backend/frontend images once, then recreate
            # backend-blue and frontend-blue/green one replica at a time, waiting for each to
            # report healthy before touching the next. Host nginx (deploy/nginx-salon.conf.example)
            # and backend-lb (nginx/backend-lb.conf) retry against the other replica if the one
            # they picked is mid-restart, so a real request — including a manager's in-flight
            # reply — never sees a dropped connection while one replica is cycling.
            #
            # backend-green is TEMPORARILY OUT of rotation (see nginx/backend-lb.conf) — running
            # two permanently-live backend instances raced several @Scheduled jobs that have no
            # distributed lock, risking duplicate SMS sends. Only backend-blue is deployed until
            # that's fixed; frontend stays blue/green throughout since it has no scheduled jobs.
            sudo docker compose build backend-blue frontend-blue

            wait_healthy() {
              for i in \$(seq 1 30); do
                if [ "\$(sudo docker inspect -f '{{.State.Health.Status}}' "\$1" 2>/dev/null)" = "healthy" ]; then
                  echo "\$1 healthy"; return 0
                fi
                sleep 3
              done
              echo "\$1 did not become healthy in time" >&2
              return 1
            }

            sudo docker compose up -d --no-deps backend-blue
            wait_healthy salonreview-backend-blue

            # backend-blue just got a fresh container IP — make backend-lb re-resolve it. A
            # graceful reload (not a restart) never drops an in-flight connection.
            sudo docker compose exec -T backend-lb nginx -s reload
            sleep 2

            sudo docker compose up -d --no-deps frontend-blue
            wait_healthy salonreview-frontend-blue

            sudo docker compose up -d --no-deps frontend-green
            wait_healthy salonreview-frontend-green

            sudo docker image prune -f
            sudo docker compose ps
          EOF
