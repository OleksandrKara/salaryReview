spring:
  application:
    name: salonreview

  datasource:
    url: jdbc:postgresql://localhost:5432/salonreview
    username: salon
    password: salon
    hikari:
      initialization-fail-timeout: -1   # don't crash if DB not yet ready

  jpa:
    hibernate:
      ddl-auto: validate                # entities must match Flyway schema
    properties:
      hibernate:
        format_sql: true
    open-in-view: false                 # avoid lazy-loading footguns

  flyway:
    enabled: true
    baseline-on-migrate: true

  # HttpSession backing store: see com.salonreview.config.HttpSessionConfig, NOT this
  # `spring.session.*` block — Spring Boot 4.0.6 ships no auto-configuration for these properties
  # at all (confirmed: spring-boot-autoconfigure-4.0.6 has zero "session" entries in its
  # configuration metadata, and there is no separate spring-boot-session module either), so a
  # `store-type: jdbc` key here has always silently done nothing. That inert config previously sat
  # right here and looked correct, which is exactly how the session-persistence feature shipped
  # without actually working — every backend redeploy was still wiping everyone's session via
  # Tomcat's plain in-memory HttpSession, JDBC-backed store or not.

# Square API — credentials come from the environment so secrets never land in git.
# SANDBOX by default; set SQUARE_ENVIRONMENT=production to hit real salon data.
#
# webhook.* backs the checkout-review-request automation's payment.updated receiver (see
# openspec/changes/sms-automations-hub). Blank signature-key means every webhook request is
# rejected — same "no sensible open default" shape as internal.api.key below. notification-url
# must match, byte-for-byte, the URL configured in the Square Developer Dashboard subscription —
# it's part of the HMAC input, not just documentation.
square:
  environment: ${SQUARE_ENVIRONMENT:sandbox}
  access-token: ${SQUARE_ACCESS_TOKEN:}
  location-id: ${SQUARE_LOCATION_ID:}
  webhook:
    signature-key: ${SQUARE_WEBHOOK_SIGNATURE_KEY:}
    notification-url: ${SQUARE_WEBHOOK_NOTIFICATION_URL:https://salon.akluxnails.com/api/public/webhooks/square}

# Base URL of each public landing page (all served by the separate salonLandings/akluxnails-home
# services), keyed by marketing.landing_pages.slug — used to build ?v=<key> deep links to a
# specific marketing variant on the owner marketing dashboard. Add an entry here whenever a new
# landing page is added to that schema.
marketing:
  landing-base-urls:
    mani: ${MARKETING_LANDING_BASE_URL_MANI:https://mani.akluxnails.com}
    home: ${MARKETING_LANDING_BASE_URL_HOME:https://akluxnails.com}

# Single shared owner login (Phase 1). The frontend holds these server-side and proxies calls.
app:
  auth:
    username: ${APP_OWNER_USERNAME:owner}
    password: ${APP_OWNER_PASSWORD:}
  # This app's own public origin — used to build the click-tracked GET /r/{id} short links sent in
  # the checkout-review-request automation's reply messages (see
  # openspec/changes/sms-automations-hub).
  public-base-url: ${APP_PUBLIC_BASE_URL:https://salon.akluxnails.com}

# Shared secret for service-to-service calls from mani/akluxnails-home (Telegram 4-hand-request
# relay — see InternalApiProperties/InternalNotificationController). Blank means every internal
# call is rejected; set INTERNAL_API_KEY to the same value on this app and both callers.
internal:
  api:
    key: ${INTERNAL_API_KEY:}

# Twilio's inbound-SMS webhook (reply branching for the checkout-review-request automation — see
# openspec/changes/sms-automations-hub). Blank auth-token means every inbound request is rejected.
twilio:
  inbound:
    auth-token: ${TWILIO_AUTH_TOKEN:}
    webhook-url: ${TWILIO_INBOUND_WEBHOOK_URL:https://salon.akluxnails.com/api/public/sms/inbound}

# same_day_rebooking_discount automation — see openspec/changes/same-day-rebooking-discount.
# promo-secret signs the ?promo=/&exp= promo link (blank means the short-link resolver can't
# produce a signed URL, so it 404s rather than emitting an unsigned/forgeable one — see D8).
# consent-segment-id is Square's own "Text Subscribers" customer-group id, an alternate consent
# source alongside marketing.contacts.sms_marketing_consent (see D3). auto-discount-group-id is
# blank until the one-time Square Catalog/CustomerGroup setup (see D7) is done, at which point
# group enrollment/removal simply no-ops rather than erroring.
rebooking:
  promo-secret: ${REBOOKING_PROMO_SECRET:}
  consent-segment-id: ${REBOOKING_CONSENT_SEGMENT_ID:gv2:DN9J6H6X8D4NN9202T6PKWK43C}
  auto-discount-group-id: ${REBOOKING_AUTO_DISCOUNT_GROUP_ID:}
  # $5 coupon for lapsed_customer_winback — see openspec/changes/lapsed-customer-winback-automation
  # design.md D9. Separate Square Catalog group from auto-discount-group-id above (different
  # amount, same no-op-until-configured convention).
  winback-auto-discount-group-id: ${REBOOKING_WINBACK_AUTO_DISCOUNT_GROUP_ID:}

# VIP badge/filter on the Contacts tab (see MarketingContactsService#visitCountsByCustomerId) —
# a customer with at least this many distinct-day visits (per provider_visit) is flagged VIP.
# Grounded in real ~13-month history: 4+ visits is the natural cutoff separating the ~17% of
# repeat customers worth treating specially from one-off/occasional visitors. Strictly data-driven
# by design — no manual override field, per the owner's own call.
vip:
  visit-threshold: ${VIP_VISIT_THRESHOLD:4}

# AI triage (suspicious-booking explainer). Feature flag is off by default; turn on per environment
# only after ANTHROPIC_API_KEY and LANGSMITH_API_KEY are set. See AiTriageProperties.java.
ai:
  triage:
    enabled: ${AI_TRIAGE_ENABLED:false}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    langsmith-api-key: ${LANGSMITH_API_KEY:}
    langsmith-project: ${LANGSMITH_PROJECT:salary-review-suspicious-triage}
  # AI funnel analysis ("Analyze Funnel" button). Feature flag is off by default; shares
  # ANTHROPIC_API_KEY with triage above. See AiFunnelAnalysisProperties.java.
  funnel-analysis:
    enabled: ${AI_FUNNEL_ANALYSIS_ENABLED:false}

# RAG knowledge assistant. Feature flag is off by default; turn on per environment only after
# ANTHROPIC_API_KEY (answers, shared with triage) and VOYAGE_API_KEY (embeddings) are set.
# See RagProperties.java.
rag:
  enabled: ${RAG_ENABLED:false}
  voyage-api-key: ${VOYAGE_API_KEY:}
  suggestions:
    # Grounded starter prompts in the chat widget. On by default; set false to hide them.
    enabled: ${RAG_SUGGESTIONS_ENABLED:true}

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    # Without this, ResponseStatusException's reason (e.g. "Username already taken", "Can't
    # delete — has recorded activity") never reaches the JSON body's `message` field, so callers
    # only ever see a generic "409 Conflict". All owner-only endpoints already require auth, so
    # there's no sensitive-leakage concern in exposing these deliberately-written messages.
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
