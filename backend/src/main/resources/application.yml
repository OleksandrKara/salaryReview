spring:
  application:
    name: salonreview

  datasource:
    url: jdbc:postgresql://localhost:5432/salonreview
    username: salon
    password: salon
    hikari:
      initialization-fail-timeout: -1   # don't crash if DB not yet ready

  jpa:
    hibernate:
      ddl-auto: validate                # entities must match Flyway schema
    properties:
      hibernate:
        format_sql: true
    open-in-view: false                 # avoid lazy-loading footguns

  flyway:
    enabled: true
    baseline-on-migrate: true

# Square API — credentials come from the environment so secrets never land in git.
# SANDBOX by default; set SQUARE_ENVIRONMENT=production to hit real salon data.
square:
  environment: ${SQUARE_ENVIRONMENT:sandbox}
  access-token: ${SQUARE_ACCESS_TOKEN:}
  location-id: ${SQUARE_LOCATION_ID:}

# Base URL of each public landing page (all served by the separate salonLandings/akluxnails-home
# services), keyed by marketing.landing_pages.slug — used to build ?v=<key> deep links to a
# specific marketing variant on the owner marketing dashboard. Add an entry here whenever a new
# landing page is added to that schema.
marketing:
  landing-base-urls:
    mani: ${MARKETING_LANDING_BASE_URL_MANI:https://mani.akluxnails.com}
    home: ${MARKETING_LANDING_BASE_URL_HOME:https://akluxnails.com}

# Single shared owner login (Phase 1). The frontend holds these server-side and proxies calls.
app:
  auth:
    username: ${APP_OWNER_USERNAME:owner}
    password: ${APP_OWNER_PASSWORD:}

# AI triage (suspicious-booking explainer). Feature flag is off by default; turn on per environment
# only after ANTHROPIC_API_KEY and LANGSMITH_API_KEY are set. See AiTriageProperties.java.
ai:
  triage:
    enabled: ${AI_TRIAGE_ENABLED:false}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    langsmith-api-key: ${LANGSMITH_API_KEY:}
    langsmith-project: ${LANGSMITH_PROJECT:salary-review-suspicious-triage}

# RAG knowledge assistant. Feature flag is off by default; turn on per environment only after
# ANTHROPIC_API_KEY (answers, shared with triage) and VOYAGE_API_KEY (embeddings) are set.
# See RagProperties.java.
rag:
  enabled: ${RAG_ENABLED:false}
  voyage-api-key: ${VOYAGE_API_KEY:}
  suggestions:
    # Grounded starter prompts in the chat widget. On by default; set false to hide them.
    enabled: ${RAG_SUGGESTIONS_ENABLED:true}

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      # Stay signed in through a 12 h idle window (was Tomcat's 30 min default), matching the 12 h
      # `sid` cookie set in the frontend login route — so a session lasts up to 12 h. See docs/CACHING.md.
      timeout: 12h
  error:
    # Without this, ResponseStatusException's reason (e.g. "Username already taken", "Can't
    # delete — has recorded activity") never reaches the JSON body's `message` field, so callers
    # only ever see a generic "409 Conflict". All owner-only endpoints already require auth, so
    # there's no sensitive-leakage concern in exposing these deliberately-written messages.
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
