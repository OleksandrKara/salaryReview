services:
  postgres:
    # pgvector image is the official postgres:16 plus the `vector` extension — same PGDATA layout,
    # so the existing postgres-data volume mounts unchanged (RAG knowledge assistant, V22 enables it).
    image: pgvector/pgvector:pg16
    container_name: salonreview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: salonreview
      POSTGRES_USER: salon
      # Set a strong POSTGRES_PASSWORD in the .env next to this file (dev default: salon).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salon}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salonreview"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port published — only reachable by other services on the internal Docker network.

  backend:
    build:
      context: ./backend
    container_name: salonreview-backend
    restart: unless-stopped
    ports:
      # Loopback only: never reachable from the public internet (the frontend talks to it over the
      # internal Docker network at http://backend:8080). Published to localhost so host-side debugging
      # works — `curl localhost:8080/api/...` on your laptop, or via an SSH tunnel on the server.
      - "127.0.0.1:8080:8080"
    environment:
      # Override the dev defaults in application.yml — talk to the postgres service via Docker DNS.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/salonreview
      SPRING_DATASOURCE_USERNAME: salon
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-salon}
      # Square credentials — read from your shell or the .env file next to this compose file.
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      # Square's payment.updated/payment.created webhook (checkout-review-request automation).
      # Blank signature-key means every webhook request is rejected — was missing here entirely
      # until the automation's first real payment revealed no subscription/signature-key existed
      # on either side.
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      SQUARE_WEBHOOK_NOTIFICATION_URL: ${SQUARE_WEBHOOK_NOTIFICATION_URL:-https://salon.akluxnails.com/api/public/webhooks/square}
      # Twilio's inbound-SMS webhook (reply branching for checkout-review-request/lead_follow_up).
      # Blank auth-token means every inbound reply is rejected — same "referenced in
      # application.yml but never actually passed through" gap the Square webhook had.
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_INBOUND_WEBHOOK_URL: ${TWILIO_INBOUND_WEBHOOK_URL:-https://salon.akluxnails.com/api/public/sms/inbound}
      # same_day_rebooking_discount automation (openspec/changes/same-day-rebooking-discount).
      # Blank promo secret means the promo short link can't be signed, so it 404s rather than
      # emitting an unsigned link. Auto-discount group id is blank until the one-time Square
      # Catalog/CustomerGroup setup is done — group enrollment simply no-ops until then.
      REBOOKING_PROMO_SECRET: ${REBOOKING_PROMO_SECRET:-}
      REBOOKING_CONSENT_SEGMENT_ID: ${REBOOKING_CONSENT_SEGMENT_ID:-}
      REBOOKING_AUTO_DISCOUNT_GROUP_ID: ${REBOOKING_AUTO_DISCOUNT_GROUP_ID:-}
      # First owner account, seeded when the user table is empty. Use a strong password on a server.
      APP_OWNER_USERNAME: ${APP_OWNER_USERNAME:-owner}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-changeme}
      # AI triage (suspicious-booking explainer). Feature flag is off by default —
      # set AI_TRIAGE_ENABLED=true to expose the Explain button in the UI.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-salary-review-suspicious-triage}
      AI_TRIAGE_ENABLED: ${AI_TRIAGE_ENABLED:-false}
      # AI funnel analysis ("Analyze Funnel" button). Feature flag is off by default — set
      # AI_FUNNEL_ANALYSIS_ENABLED=true to expose it. Shares ANTHROPIC_API_KEY with triage above.
      AI_FUNNEL_ANALYSIS_ENABLED: ${AI_FUNNEL_ANALYSIS_ENABLED:-false}
      # RAG knowledge assistant. Feature flag is off by default — set RAG_ENABLED=true (and a
      # VOYAGE_API_KEY for embeddings) to expose the /api/rag endpoints and the chat/admin UI.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      # Grounded starter prompts in the chat widget. On by default; set false to hide them.
      RAG_SUGGESTIONS_ENABLED: ${RAG_SUGGESTIONS_ENABLED:-true}
      # Shared secret for service-to-service calls from mani/akluxnails-home (Telegram
      # 4-hand-request relay) — blank means every internal call is rejected.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: salonreview-frontend
    restart: unless-stopped
    environment:
      # Server-side fetches (Node in the container) reach the backend over Docker DNS. The browser
      # only ever talks to this frontend (same-origin /api/* proxies), so no backend URL is exposed
      # to the client — nothing hardcoded to localhost, and no public API base to configure.
      BACKEND_URL: http://backend:8080
      # Auth cookies are marked Secure automatically when a reverse proxy sends
      # X-Forwarded-Proto: https. Uncomment to force it on (e.g. TLS terminated elsewhere):
      # COOKIE_SECURE: "true"
    ports:
      # Bound to loopback only: nginx (same host) reverse-proxies HTTPS to it, but the raw IP isn't
      # reachable from the public internet — forcing all traffic through TLS. See app/api/login/route.ts
      # for the X-Forwarded-Proto → Secure-cookie handling that nginx enables.
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Database admin UI. Bound to loopback only — reach it via an SSH tunnel
  # (ssh -L 8081:localhost:8081 user@server), never the public internet.
  adminer:
    image: adminer:latest
    container_name: salonreview-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
