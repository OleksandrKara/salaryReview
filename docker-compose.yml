services:
  postgres:
    image: postgres:16
    container_name: salonreview-postgres
    environment:
      POSTGRES_DB: salonreview
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salonreview"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
